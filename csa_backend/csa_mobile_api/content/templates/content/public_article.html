<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} — CSA Ghana</title>
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ og_description }}">
{% if image_url %}<meta property="og:image" content="{{ image_url }}">{% endif %}
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: #F8F9FB;
    color: #1a1a1a;
    margin: 0;
    padding: 24px 16px 60px;
  }
  .card {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .card img { width: 100%; display: block; }
  .content { padding: 24px; }
  .eyebrow { color: #00334D; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .date { color: #767676; font-size: 13px; margin-bottom: 16px; }
  .body-text { font-size: 15px; line-height: 1.7; white-space: pre-line; }
  .app-banner {
    max-width: 640px;
    margin: 16px auto 0;
    background: #00334D;
    color: #fff;
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="card">
    {% if image_url %}<img src="{{ image_url }}" alt="{{ title }}">{% endif %}
    <div class="content">
      <p class="eyebrow">{{ eyebrow }}</p>
      <h1>{{ title }}</h1>
      {% if subtitle %}<p class="date">{{ subtitle }}</p>{% endif %}
      <p class="body-text">{{ body }}</p>
    </div>
  </div>
  <p class="app-banner">Get the full experience in the CSA mobile app.</p>
</body>
</html>
