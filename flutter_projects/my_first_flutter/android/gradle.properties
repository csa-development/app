org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Djava.io.tmpdir=C:/gradletmp
systemProp.java.net.preferIPv4Stack=true
# Root cause of "Unable to establish loopback connection" /
# "SocketException: Invalid argument: connect" on this machine: modern
# JDKs implement NIO's internal self-pipe using a Unix domain socket
# file under java.io.tmpdir, which on Windows normally resolves into
# the user's profile temp folder — here, literally
# "C:\Users\CSA HP 70\AppData\Local\Temp" (note the space in the
# Windows username "CSA HP 70"). Java's native AF_UNIX socket path
# handling on Windows breaks on that space — a known JDK bug, not a
# firewall/antivirus/permissions issue (a firewall rule for java.exe
# was tried first and made no difference, confirming that). Pointing
# java.io.tmpdir at a short, space-free path sidesteps it entirely.
#
# IMPORTANT: the -Djava.io.tmpdir arg on line 1 only reaches the Gradle
# DAEMON JVM. The failing loopback socket is opened first by the Gradle
# CLIENT JVM (fails ~10-15s in, before any real build work), which never
# reads org.gradle.jvmargs. So the TMP/TEMP env vars must ALSO point at a
# space-free path. Build via build-apk.ps1 in the project root, or run:
#   $env:TMP='C:/gradletmp'; $env:TEMP='C:/gradletmp'; flutter build apk --release
# Permanent fix: set TMP and TEMP to C:\gradletmp in the Windows user
# environment variables (then this whole block can be deleted).
# (org.gradle.daemon=false was tried as an earlier, wrong-theory fix
# and left in place too — harmless, and true single-use JVMs are one
# less moving part while this is fresh.)
org.gradle.daemon=false
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.20.8-hotspot
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
